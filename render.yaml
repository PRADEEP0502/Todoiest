# Render.com: one web service that serves the built dashboard and the /api/attachment endpoint.
# The Todoist token is not set here — each person pastes their own in the dashboard's Settings,
# and it is sent to /api/attachment in a header for the length of one request.
services:
  - type: web
    name: md-dashboard
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npm run build:server
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
